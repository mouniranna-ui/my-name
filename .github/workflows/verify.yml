name: Verify skill and distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/verify_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python plugins/photo-to-autocad/skills/draft-cad-from-images/scripts/test_cad_tools.py
      - run: python tools/build_release.py
