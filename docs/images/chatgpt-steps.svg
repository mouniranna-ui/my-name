<circle cx="780" cy="211" r="20" fill="#4ce2ba"/>
<text x="780" y="218" text-anchor="middle" fill="#10263b" font-size="21" font-weight="700">3</text>
<text x="765" y="264" fill="#ffffff" font-size="23" font-weight="700">Check capabilities</text>
<text x="765" y="303" fill="#d4e0ed" font-size="18">Can it read your image?</text>
<text x="765" y="332" fill="#d4e0ed" font-size="18">Can it run Python?</text>
