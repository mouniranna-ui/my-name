<text x="1105" y="264" fill="#ffffff" font-size="23" font-weight="700">Review delivery</text>
<text x="1105" y="303" fill="#d4e0ed" font-size="18">With execution: DXF/PDF</text>
<text x="1105" y="332" fill="#d4e0ed" font-size="18">Without it: code + ledger</text>
<text x="1105" y="361" fill="#d4e0ed" font-size="18">Run the code locally</text>
<text x="60" y="465" fill="#a9bfd5" font-size="18">Uploading a ZIP to a chat is not plugin installation. A GitHub release is separate from the public Plugins Directory.</text>
