<text x="85" y="264" fill="#ffffff" font-size="23" font-weight="700">Get the files</text>
<text x="85" y="303" fill="#d4e0ed" font-size="18">Download the source ZIP</text>
<text x="85" y="332" fill="#d4e0ed" font-size="18">Read the ChatGPT guide</text>
<text x="85" y="361" fill="#d4e0ed" font-size="18">Choose a supported route</text>
