<text x="425" y="264" fill="#ffffff" font-size="23" font-weight="700">Load the workflow</text>
<text x="425" y="303" fill="#d4e0ed" font-size="18">Desktop: local marketplace</text>
<text x="425" y="332" fill="#d4e0ed" font-size="18">Web/mobile: copy prompt</text>
<text x="425" y="361" fill="#d4e0ed" font-size="18">Attach source images</text>
